<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>


    <div class="contact-container">
        <h2>Neem contact op</h2>
        
        <form action="mailto:yasserachahbar@outlook.com" method="POST" enctype="text/plain">
            
            <label for="naam">Naam:</label>
            <input type="text" id="naam" name="Naam" required>

            <label for="email">Jouw e-mailadres:</label>
            <input type="email" id="email" name="E-mail" required>

            <label for="bericht">Reden / Bericht:</label>
            <textarea id="bericht" name="Bericht" rows="5" required></textarea>

            <button type="submit">Verstuur bericht</button>
            
        </form>
    </div>

</body>
</html>
